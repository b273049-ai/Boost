<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel DJ Mobile</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #222; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        input[type=range] { width: 100%; height: 30px; }
        .danger { color: #ff3333; font-weight: bold; }
        #status { font-size: 14px; color: #00ffcc; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>MESA DJ & BOOST</h2>
    <div id="status">Conectando ao PC...</div>

    <div class="card">
        <label class="danger">🔥 GAIN BOOST (ESTOURAR): <span id="g-val">1</span>x</label>
        <input type="range" id="gain" min="1" max="50" value="1" step="0.5">
    </div>

    <div class="card">
        <label>🔊 ABAFAR (LOWPASS): <span id="lp-val">20000</span> Hz</label>
        <input type="range" id="lowpass" min="200" max="20000" value="20000" step="100">
    </div>

    <div class="card">
        <label>🎵 VELOCIDADE / PITCH: <span id="p-val">1</span>x</label>
        <input type="range" id="pitch" min="0.5" max="2" value="1" step="0.05">
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pcId = urlParams.get('id');

        if (!pcId) {
            document.getElementById('status').innerText = 'ID do PC não encontrado na URL!';
        } else {
            const peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(pcId);
                conn.on('open', () => {
                    document.getElementById('status').innerText = '🟢 CONECTADO AO YOUTUBE!';
                    
                    function send(type, val) {
                        conn.send({ type: type, val: parseFloat(val) });
                    }

                    document.getElementById('gain').oninput = function() {
                        document.getElementById('g-val').innerText = this.value;
                        send('gain', this.value);
                    };
                    document.getElementById('lowpass').oninput = function() {
                        document.getElementById('lp-val').innerText = this.value;
                        send('lowpass', this.value);
                    };
                    document.getElementById('pitch').oninput = function() {
                        document.getElementById('p-val').innerText = this.value;
                        send('pitch', this.value);
                    };
                });
            });
        }
    </script>
</body>
</html>
